<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun - SYADZZ STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;padding:20px;background:linear-gradient(135deg,#080812,#241044);color:#fff;display:flex;align-items:center;justify-content:center}
.box{width:100%;max-width:430px;background:#19192d;border:1px solid #454565;border-radius:18px;padding:22px;box-shadow:0 15px 40px rgba(0,0,0,.35)}
h1{text-align:center;color:#ffd900;margin:0 0 6px;font-size:28px}
.sub{text-align:center;color:#999;font-size:12px;margin-bottom:18px}
label{display:block;margin:12px 0 7px;font-weight:800;font-size:12px}
input{width:100%;padding:12px;border:1px solid #50506b;border-radius:9px;background:#11111c;color:#fff;outline:none}
input:focus{border-color:#ffd900}
button{width:100%;padding:11px;border:0;border-radius:9px;font-weight:900;cursor:pointer;margin-top:10px}
.primary{background:linear-gradient(90deg,#ffd900,#ff9f00);color:#111}.secondary{background:#303047;color:#fff}
.msg{margin-top:11px;text-align:center;font-size:12px;line-height:1.5;min-height:18px}.error{color:#ff9aaa}.success{color:#8dffc6}.waiting{color:#ffe866}
.otp-box{display:none;margin-top:14px;padding:13px;border:1px solid #2d2d43;border-radius:12px;background:#10101d}
.small{color:#8c8ca4;font-size:10px;line-height:1.5;margin-top:7px}
.back{margin-top:12px;text-align:center}.back a{color:#aaa;font-size:11px;text-decoration:none}.back a:hover{color:#fff}
</style>
</head>
<body>
<div class="box">
    <h1>SYADZZ STORE</h1>
    <div class="sub">BUAT AKUN CUSTOMER</div>

    <div id="registerForm">
        <label>Email</label>
        <input id="registerEmail" type="email" autocomplete="email" placeholder="Masukkan email kamu">
        <div class="small">OTP hanya digunakan saat membuat akun. Setelah akun berhasil dibuat, kamu bisa masuk dari halaman Calculator dengan email terdaftar.</div>
        <button id="sendOtpBtn" class="primary" type="button" onclick="sendRegisterOtp()">KIRIM OTP</button>
        <div id="registerMsg" class="msg"></div>
    </div>

    <button id="enterOtpBtn" class="primary" type="button" onclick="showOtpEntry()" style="display:none">MASUKKAN OTP</button>

    <div id="otpBox" class="otp-box">
        <div style="font-weight:900;font-size:13px">📩 VERIFIKASI EMAIL</div>
        <div id="otpInfo" class="small">Kode OTP sudah dikirim ke email kamu. Gunakan kode dari email TERBARU.</div>
        <div id="otpEntryArea" style="display:none">
            <label>Kode OTP</label>
            <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
            <button id="verifyBtn" class="primary" type="button" onclick="verifyRegisterOtp()">VERIFIKASI & BUAT AKUN</button>
        </div>
        <button id="resendBtn" class="secondary" type="button" onclick="resendRegisterOtp()" disabled>KIRIM ULANG OTP (60)</button>
        <button class="secondary" type="button" onclick="backToRegister()">GANTI EMAIL</button>
        <div id="otpMsg" class="msg"></div>
    </div>

    <div class="back"><a href="index.html#calculatorPage">← Kembali ke Calculator</a></div>
</div>
<script>
const SUPABASE_URL = "https://oyqdraemxlzqenbsdujh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uLjeOGdhxSQUjc4fCrkN9Q_QGabJxzu";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const LOGIN_KEY = "syadzz_calculator_email";
const LOGOUT_KEY = "syadzz_calculator_logged_out";
let registerEmail = "";
let cooldownUntil = 0;
let cooldownTimer = null;
let busy = false;

function setMsg(id,text,type){const el=document.getElementById(id);el.className="msg"+(type?" "+type:"");el.innerText=text||""}
function secondsFromMessage(msg){const m=String(msg||"").match(/(?:after|dalam|in)\s+(\d+)\s*seconds?/i);return m?Number(m[1]):60}
function startCooldown(seconds){
    cooldownUntil=Date.now()+Math.max(1,seconds)*1000;
    clearInterval(cooldownTimer);
    const btn=document.getElementById("resendBtn");
    const tick=()=>{const left=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));btn.disabled=left>0;btn.textContent=left>0?`KIRIM ULANG OTP (${left})`:"KIRIM ULANG OTP";if(left<=0)clearInterval(cooldownTimer)};
    tick();cooldownTimer=setInterval(tick,1000);
}
async function sendRegisterOtp(){
    if(busy)return;
    const email=(document.getElementById("registerEmail").value||"").trim().toLowerCase();
    if(!email){setMsg("registerMsg","Masukkan email terlebih dahulu.","error");return}
    busy=true;setMsg("registerMsg","Mengecek email...","waiting");
    try{
        const {data:registered,error:checkError}=await supabaseClient.rpc("is_calculator_email_registered_v1",{p_email:email});
        if(checkError){setMsg("registerMsg","Gagal mengecek email: "+checkError.message,"error");return}
        if(registered===true){setMsg("registerMsg","Email sudah terdaftar. Silakan kembali ke Calculator dan klik MASUK.","error");return}
        setMsg("registerMsg","Mengirim OTP...","waiting");
        const {error}=await supabaseClient.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
        if(error){
            const msg=error.message||"Error";
            const wait=secondsFromMessage(msg);
            const isCooldown=/for security purposes.*only request this after\s+\d+\s+seconds?/i.test(msg);
            if(isCooldown){
                startCooldown(wait);
                setMsg("registerMsg",`Coba lagi dalam ${wait} detik.`,"error");
                return;
            }
            setMsg("registerMsg","Pendaftaran gagal: "+msg,"error");
            return;
        }
        registerEmail=email;
        document.getElementById("registerForm").style.display="none";
        document.getElementById("enterOtpBtn").style.display="block";
        document.getElementById("otpBox").style.display="none";
        document.getElementById("otpEntryArea").style.display="none";
        document.getElementById("otpInfo").innerText=`Kode OTP sudah dikirim ke ${email}. Cek inbox/spam.`;
        setMsg("registerMsg","✅ OTP sudah dikirim ke email kamu. Klik MASUKKAN OTP.","success");
        setMsg("otpMsg","✅ OTP sudah dikirim. Klik MASUKKAN OTP untuk melanjutkan.","waiting");
        startCooldown(60);
    }finally{busy=false}
}
async function resendRegisterOtp(){
    if(busy)return;
    const left=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));
    if(left>0){startCooldown(left);return}
    if(!registerEmail){setMsg("otpMsg","Email pendaftaran tidak ditemukan.","error");return}
    busy=true;setMsg("otpMsg","Mengirim OTP baru...","waiting");
    try{
        const {error}=await supabaseClient.auth.signInWithOtp({email:registerEmail,options:{shouldCreateUser:true}});
        if(error){
            const msg=error.message||"Error";
            const wait=secondsFromMessage(msg);
            const isCooldown=/for security purposes.*only request this after\s+\d+\s+seconds?/i.test(msg);
            if(isCooldown){
                startCooldown(wait);
                setMsg("otpMsg",`Coba lagi dalam ${wait} detik.`,"error");
            }else{
                setMsg("otpMsg","Gagal mengirim OTP: "+msg,"error");
            }
            return;
        }
        setMsg("otpMsg","✅ OTP baru sudah dikirim. Cek inbox/spam.","success");startCooldown(60);
    }finally{busy=false}
}
async function verifyRegisterOtp(){
    if(busy)return;

    const otpInput=document.getElementById("otpCode");
    const verifyBtn=document.getElementById("verifyBtn");
    const token=(otpInput.value||"").replace(/\D/g,"");

    if(token.length!==6){
        setMsg("otpMsg","Masukkan kode OTP 6 digit yang diterima di email.","error");
        otpInput.focus();
        return;
    }

    if(!registerEmail){
        setMsg("otpMsg","Email pendaftaran tidak ditemukan. Silakan kirim OTP lagi.","error");
        return;
    }

    busy=true;
    verifyBtn.disabled=true;
    setMsg("otpMsg","Memverifikasi OTP...","waiting");

    try{
        // Untuk email OTP Supabase gunakan type: "email".
        // Jangan fallback ke type "signup" karena itu adalah alur berbeda.
        const {data,error}=await supabaseClient.auth.verifyOtp({
            email:registerEmail,
            token,
            type:"email"
        });

        if(error){
            const msg=String(error.message||"Error");
            otpInput.select();
            setMsg(
                "otpMsg",
                "OTP gagal diverifikasi: "+msg+". Pastikan kode 6 digit dari email TERBARU.",
                "error"
            );
            return;
        }

        if(!data?.session){
            setMsg(
                "otpMsg",
                "OTP benar, tetapi sesi login belum tersedia. Coba kembali ke Calculator.",
                "error"
            );
            return;
        }

        localStorage.setItem(LOGIN_KEY,registerEmail);
        localStorage.removeItem(LOGOUT_KEY);
        otpInput.value="";
        setMsg("otpMsg","✅ Akun berhasil dibuat. Mengarahkan ke Calculator...","success");

        setTimeout(()=>{
            window.location.href="index.html#calculatorPage";
        },700);

    }finally{
        busy=false;
        verifyBtn.disabled=false;
    }
}
function showOtpEntry(){
    if(!registerEmail){setMsg("registerMsg","Email pendaftaran tidak ditemukan.","error");return}
    document.getElementById("enterOtpBtn").style.display="none";
    document.getElementById("otpBox").style.display="block";
    document.getElementById("otpEntryArea").style.display="block";
    document.getElementById("otpCode").focus();
    setMsg("otpMsg","Masukkan kode OTP lengkap yang dikirim ke email kamu.","waiting");
}
function backToRegister(){clearInterval(cooldownTimer);cooldownUntil=0;registerEmail="";document.getElementById("otpBox").style.display="none";document.getElementById("otpEntryArea").style.display="none";document.getElementById("enterOtpBtn").style.display="none";document.getElementById("registerForm").style.display="block";document.getElementById("otpCode").value="";setMsg("otpMsg","");setMsg("registerMsg","")}
</script>
</body>
</html>
